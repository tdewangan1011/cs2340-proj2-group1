{% extends 'base.html' %}
{% block content %}
{% load static %}
<div class="container">

    <h2>My Applications</h2>

  {% for application in template_data.applications %}
  <div class="col-md-4 col-lg-3 mb-2">
    <div class="p-2 card align-items-center pt-4">
      <div class="card-body text-center">
        <h4>{{ application.job.title }}</h4>
          <p>{{ application.get_status_display }}</p>
      </div>
    </div>
  </div>
  {% endfor %}
</div>
{% endblock content %}
