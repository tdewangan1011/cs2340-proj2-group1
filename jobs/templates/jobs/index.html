{% extends 'base.html' %}
{% block content %}
{% load static %}
<div class="container">

    <h2>Jobs</h2>

  {% for job in template_data.jobs %}
  <div class="col-md-4 col-lg-3 mb-2">
    <div class="p-2 card align-items-center pt-4">
      <div class="card-body text-center">
        <h4>{{ job.title }}</h4>
          <p>{{ job.location }}</p>
          <p>{{ job.description }}</p>
      </div>
    </div>
  </div>
  {% endfor %}
</div>
{% endblock content %}
