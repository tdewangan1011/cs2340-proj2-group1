{% extends 'base.html' %}

{% block content %}

<div class="p-3 mt-4">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-9">
        <div class="card shadow p-3 mb-4 rounded">
          <div class="card-body">

            <h2>Edit Profile</h2>
            <p class="text-muted"> Add or edit information for recruiters to see!</p>

            <hr />

            <form method="POST">
              {% csrf_token %}
              {{ template_data.form.as_p }}
              <div class="mt-3">
                <button type="submit" class="btn btn-dark">Save Profile</button>

                <a href="{% url 'accounts.profile' %}" class="btn btn-secondary">Cancel</a>

              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

{% endblock content %}
